<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardCore Admin</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --danger: #ef4444;
      --ok: #22c55e;
      --border: #2d3a4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    main { padding: 1rem 1.25rem 2rem; max-width: 1200px; margin: 0 auto; }
    .login-box {
      max-width: 360px;
      margin: 3rem auto;
      padding: 1.5rem;
      background: var(--panel);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: var(--muted); }
    input, textarea, select, button {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 600;
      margin-top: 1rem;
    }
    button.secondary { background: var(--panel); border: 1px solid var(--border); }
    button.danger { background: var(--danger); }
    .error { color: var(--danger); font-size: 0.9rem; margin-top: 0.5rem; }
    nav.tabs {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    nav.tabs button {
      width: auto;
      margin: 0;
      padding: 0.45rem 0.85rem;
      background: var(--panel);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    nav.tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .kpi {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
    }
    .kpi strong { display: block; font-size: 1.35rem; }
    .kpi span { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    tr:hover td { background: rgba(59, 130, 246, 0.06); }
    .row-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .row-actions button { width: auto; margin: 0; padding: 0.25rem 0.5rem; font-size: 0.8rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; color: var(--muted); }
    .hidden { display: none !important; }
    /* Nutzer-Detail (Admin) */
    .user-profile { padding: 1.1rem 1.15rem; }
    .user-profile-header {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 0.25rem;
    }
    .user-avatar {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .user-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
      padding: 0.35rem;
    }
    .user-profile-title h2 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .user-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.45rem;
    }
    .badge {
      font-size: 0.72rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.admin {
      border-color: var(--accent);
      color: var(--accent);
    }
    .badge.ok {
      border-color: rgba(34, 197, 94, 0.5);
      color: var(--ok);
    }
    .badge.warn {
      border-color: rgba(239, 68, 68, 0.45);
      color: #f87171;
    }
    .user-profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem 1.25rem;
      margin-top: 1rem;
    }
    .user-section h3 {
      margin: 0 0 0.4rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .user-bio {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.92rem;
    }
    .user-address p {
      margin: 0 0 0.45rem;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .mono-small {
      font-size: 0.8rem;
      color: var(--muted);
    }
    details.user-raw-json {
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }
    details.user-raw-json summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      user-select: none;
    }
    details.user-raw-json pre {
      max-height: 14rem;
      overflow: auto;
      margin-top: 0.5rem;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <div id="view-login" class="login-box">
    <h1>CardCore Admin</h1>
    <p class="muted">Anmeldung mit Admin-Konto (JWT).</p>
    <label>E-Mail<input type="email" id="login-email" autocomplete="username" /></label>
    <label>Passwort<input type="password" id="login-password" autocomplete="current-password" /></label>
    <button type="button" id="btn-login">Anmelden</button>
    <p id="login-error" class="error hidden"></p>
  </div>

  <div id="view-app" class="hidden">
    <header>
      <h1>CardCore Admin</h1>
      <div class="row-actions">
        <span class="muted" id="who"></span>
        <button type="button" class="secondary" id="btn-logout">Abmelden</button>
      </div>
    </header>
    <main>
      <nav class="tabs" id="tabs"></nav>
      <section id="tab-dashboard"></section>
      <section id="tab-users" class="hidden"></section>
      <section id="tab-listings" class="hidden"></section>
      <section id="tab-revenue" class="hidden"></section>
      <section id="tab-support" class="hidden"></section>
      <section id="tab-reports" class="hidden"></section>
      <section id="tab-invites" class="hidden"></section>
      <section id="tab-app" class="hidden"></section>
      <section id="tab-welcome" class="hidden"></section>
    </main>
  </div>

  <script src="app.js" defer></script>

</body>
</html>
