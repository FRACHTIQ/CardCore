<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardCore Admin</title>
  <style>
    :root {
      --bg: #0b0f14;
      --bg-elevated: #111820;
      --panel: #151c26;
      --panel-hover: #1a2330;
      --text: #eef2f7;
      --muted: #8b9aaf;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --danger: #ef4444;
      --ok: #22c55e;
      --border: rgba(255, 255, 255, 0.08);
      --sidebar-w: 260px;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background:
        radial-gradient(1000px 520px at 12% -8%, rgba(59, 130, 246, 0.14), transparent 55%),
        radial-gradient(720px 420px at 88% 4%, rgba(139, 92, 246, 0.1), transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.85rem; }

    /* ——— Login ——— */
    .login-box {
      max-width: 400px;
      margin: 4rem auto;
      padding: 1.75rem;
      background: linear-gradient(165deg, var(--panel) 0%, var(--bg-elevated) 100%);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .login-box h1 { font-size: 1.35rem; letter-spacing: -0.02em; }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }
    .login-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
    }
    label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: var(--muted); }
    input, textarea, select, button {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 600;
      margin-top: 1rem;
    }
    button.secondary { background: var(--panel); border: 1px solid var(--border); }
    button.danger { background: var(--danger); }
    .error { color: var(--danger); font-size: 0.9rem; margin-top: 0.5rem; }
    /* ——— App shell ——— */
    .admin-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }
    .admin-sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.1rem 0.85rem;
      border-right: 1px solid var(--border);
      background: rgba(17, 24, 32, 0.72);
      backdrop-filter: blur(12px);
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.35rem 0.65rem 1.1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.85rem;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #fff;
      flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
    .brand-text strong { font-size: 0.95rem; letter-spacing: -0.02em; }
    .brand-text .muted { font-size: 0.72rem; }
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex: 1;
      overflow-y: auto;
      padding: 0 0.15rem;
    }
    .sidebar-nav button {
      width: 100%;
      margin: 0;
      padding: 0.55rem 0.75rem;
      text-align: left;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-weight: 500;
      font-size: 0.88rem;
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }
    .sidebar-nav button:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--border);
    }
    .sidebar-nav button.active {
      background: var(--accent-soft);
      border-color: rgba(59, 130, 246, 0.35);
      color: #dbeafe;
    }
    .sidebar-nav button:focus-visible {
      outline: 2px solid rgba(59, 130, 246, 0.55);
      outline-offset: 2px;
    }
    .sidebar-footer {
      padding: 0.75rem 0.65rem 0.25rem;
      font-size: 0.72rem;
      line-height: 1.35;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
      word-break: break-all;
      white-space: pre-line;
    }
    .admin-body {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }
    .admin-topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.9rem 1.35rem;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 20, 0.78);
      backdrop-filter: blur(10px);
    }
    .page-title {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .topbar-actions .muted {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-actions button { width: auto; margin: 0; padding: 0.45rem 0.85rem; font-size: 0.85rem; }
    .sidebar-toggle {
      display: none;
      width: auto;
      margin: 0;
      padding: 0.45rem 0.75rem;
      background: var(--panel);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
    }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 15;
    }
    .admin-shell.sidebar-open .sidebar-backdrop { display: block; }
    .admin-content {
      flex: 1;
      padding: 1.25rem 1.35rem 2.5rem;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .admin-shell {
        grid-template-columns: 1fr;
      }
      .sidebar-toggle { display: inline-block; }
      .admin-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 20;
        width: min(var(--sidebar-w), 88vw);
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: var(--shadow);
      }
      .admin-shell.sidebar-open .admin-sidebar {
        transform: translateX(0);
      }
      .admin-topbar .page-title { flex: 1; min-width: 0; }
    }

    .dashboard-hero {
      margin-bottom: 1.75rem;
    }
    .dashboard-eyebrow {
      margin: 0 0 0.35rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .dashboard-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .dashboard-lead { margin: 0.4rem 0 0; font-size: 0.92rem; max-width: 42rem; }
    .kpi-group { margin-bottom: 1.6rem; }
    .kpi-group-title {
      margin: 0 0 0.65rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 0.85rem;
    }
    @media (min-width: 1100px) {
      .grid-kpi { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
    .kpi {
      --kpi-accent: var(--accent);
      position: relative;
      overflow: hidden;
      background: linear-gradient(165deg, var(--panel) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem 1rem 1rem 1.15rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .kpi::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--kpi-accent);
      border-radius: 3px 0 0 3px;
    }
    .kpi:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }
    .kpi--blue { --kpi-accent: #3b82f6; }
    .kpi--violet { --kpi-accent: #8b5cf6; }
    .kpi--emerald { --kpi-accent: #10b981; }
    .kpi--amber { --kpi-accent: #f59e0b; }
    .kpi--rose { --kpi-accent: #f43f5e; }
    .kpi strong {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .kpi span {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    tr:hover td { background: rgba(59, 130, 246, 0.06); }
    .row-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .row-actions button { width: auto; margin: 0; padding: 0.25rem 0.5rem; font-size: 0.8rem; }
    .panel {
      background: linear-gradient(165deg, var(--panel) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; color: var(--muted); }
    .hidden { display: none !important; }
    /* Nutzer-Detail (Admin) */
    .user-profile { padding: 1.1rem 1.15rem; }
    .user-profile-header {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 0.25rem;
    }
    .user-avatar {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .user-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
      padding: 0.35rem;
    }
    .user-profile-title h2 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .user-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.45rem;
    }
    .badge {
      font-size: 0.72rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.admin {
      border-color: var(--accent);
      color: var(--accent);
    }
    .badge.ok {
      border-color: rgba(34, 197, 94, 0.5);
      color: var(--ok);
    }
    .badge.warn {
      border-color: rgba(239, 68, 68, 0.45);
      color: #f87171;
    }
    .user-profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem 1.25rem;
      margin-top: 1rem;
    }
    .user-section h3 {
      margin: 0 0 0.4rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .user-bio {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.92rem;
    }
    .user-address p {
      margin: 0 0 0.45rem;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .mono-small {
      font-size: 0.8rem;
      color: var(--muted);
    }
    details.user-raw-json {
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }
    details.user-raw-json summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      user-select: none;
    }
    details.user-raw-json pre {
      max-height: 14rem;
      overflow: auto;
      margin-top: 0.5rem;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>
  <div id="view-login" class="login-box">
    <div class="login-brand">
      <span class="login-mark" aria-hidden="true">CC</span>
      <div>
        <h1>CardCore Admin</h1>
        <p class="muted" style="margin:0;">Anmeldung mit Admin-Konto (JWT).</p>
      </div>
    </div>
    <label>E-Mail<input type="email" id="login-email" autocomplete="username" /></label>
    <label>Passwort<input type="password" id="login-password" autocomplete="current-password" /></label>
    <button type="button" id="btn-login">Anmelden</button>
    <p id="login-error" class="error hidden"></p>
  </div>

  <div id="view-app" class="hidden">
    <div class="admin-shell" id="admin-shell">
      <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
      <aside class="admin-sidebar" aria-label="Hauptnavigation">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">CC</span>
          <div class="brand-text">
            <strong>CardCore</strong>
            <span class="muted">Admin-Konsole</span>
          </div>
        </div>
        <nav class="sidebar-nav" id="tabs"></nav>
        <div class="sidebar-footer muted" id="who-sidebar"></div>
      </aside>
      <div class="admin-body">
        <header class="admin-topbar">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Menü öffnen">Menü</button>
          <h2 class="page-title" id="page-title">Dashboard</h2>
          <div class="topbar-actions">
            <span class="muted" id="who" title=""></span>
            <button type="button" class="secondary" id="btn-logout">Abmelden</button>
          </div>
        </header>
        <main class="admin-content">
          <section id="tab-dashboard"></section>
          <section id="tab-users" class="hidden"></section>
          <section id="tab-listings" class="hidden"></section>
          <section id="tab-revenue" class="hidden"></section>
          <section id="tab-support" class="hidden"></section>
          <section id="tab-reports" class="hidden"></section>
          <section id="tab-invites" class="hidden"></section>
          <section id="tab-app" class="hidden"></section>
          <section id="tab-welcome" class="hidden"></section>
        </main>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

</body>
</html>
