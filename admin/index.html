<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CardCore Admin</title>
  <style>
    :root {
      --bg: #080c11;
      --bg-elevated: #101820;
      --panel: #141b26;
      --panel-hover: #1a2330;
      --text: #eef2f7;
      --muted: #8b9aaf;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --danger: #ef4444;
      --ok: #22c55e;
      --border: rgba(255, 255, 255, 0.075);
      --sidebar-w: 272px;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.45);
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "Segoe UI Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      background:
        radial-gradient(1100px 560px at 10% -12%, rgba(59, 130, 246, 0.16), transparent 58%),
        radial-gradient(760px 480px at 92% 0%, rgba(139, 92, 246, 0.12), transparent 52%),
        radial-gradient(600px 400px at 50% 100%, rgba(16, 185, 129, 0.05), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection {
      background: rgba(59, 130, 246, 0.35);
      color: #fff;
    }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.85rem; }

    /* ——— Login ——— */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .login-page::before {
      content: "";
      position: absolute;
      inset: -40% -20%;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 20%, transparent 70%);
      pointer-events: none;
    }
    .login-box {
      position: relative;
      max-width: 420px;
      width: 100%;
      padding: 1.85rem;
      background: linear-gradient(168deg, rgba(26, 35, 48, 0.95) 0%, rgba(16, 24, 32, 0.98) 100%);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .login-box h1 { font-size: 1.35rem; letter-spacing: -0.02em; }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.35rem;
    }
    .login-mark {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: grid;
      place-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
    }
    label { display: block; margin-top: 0.75rem; font-size: 0.82rem; color: var(--muted); font-weight: 500; }
    input, textarea, select, button {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(8, 12, 17, 0.65);
      color: var(--text);
      font: inherit;
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s var(--ease);
    }
    input:hover, textarea:hover, select:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }
    input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: none;
      border-color: rgba(59, 130, 246, 0.55);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }
    button {
      cursor: pointer;
      background: linear-gradient(180deg, #4b8df8 0%, var(--accent) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-weight: 600;
      margin-top: 1rem;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
      transition: transform 0.12s var(--ease), box-shadow 0.12s var(--ease), filter 0.12s var(--ease);
    }
    button:hover {
      filter: brightness(1.06);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.32);
    }
    button:active { transform: translateY(1px); }
    button.secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      box-shadow: none;
      color: var(--text);
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.14);
      filter: none;
    }
    button.danger {
      background: linear-gradient(180deg, #f87171 0%, var(--danger) 100%);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.22);
    }
    button:focus-visible {
      outline: 2px solid rgba(59, 130, 246, 0.55);
      outline-offset: 2px;
    }
    .error { color: var(--danger); font-size: 0.9rem; margin-top: 0.5rem; }
    .msg-ok { color: var(--ok) !important; }
    .msg-danger { color: var(--danger) !important; }
    code.inline, .inline-code {
      font-family: var(--mono);
      font-size: 0.82em;
      padding: 0.12rem 0.35rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
    }
    /* ——— App shell ——— */
    .admin-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }
    .admin-sidebar {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.1rem 0.85rem;
      border-right: 1px solid var(--border);
      background: rgba(17, 24, 32, 0.72);
      backdrop-filter: blur(12px);
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.35rem 0.65rem 1.1rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.85rem;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: grid;
      place-items: center;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #fff;
      flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; gap: 0.1rem; min-width: 0; }
    .brand-text strong { font-size: 0.95rem; letter-spacing: -0.02em; }
    .brand-text .muted { font-size: 0.72rem; }
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex: 1;
      overflow-y: auto;
      padding: 0 0.15rem;
    }
    .sidebar-nav button {
      width: 100%;
      margin: 0;
      padding: 0.5rem 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-align: left;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-weight: 500;
      font-size: 0.875rem;
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease), transform 0.12s var(--ease);
    }
    .sidebar-nav button:hover {
      background: rgba(255, 255, 255, 0.045);
      border-color: var(--border);
    }
    .sidebar-nav button.active {
      background: linear-gradient(90deg, var(--accent-soft), rgba(59, 130, 246, 0.06));
      border-color: rgba(59, 130, 246, 0.38);
      color: #e0f2fe;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .sidebar-nav button:focus-visible {
      outline: 2px solid rgba(59, 130, 246, 0.55);
      outline-offset: 2px;
    }
    .nav-ico-wrap {
      display: grid;
      place-items: center;
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--muted);
      flex-shrink: 0;
      transition: background 0.15s var(--ease), color 0.15s var(--ease);
    }
    .sidebar-nav button.active .nav-ico-wrap {
      background: rgba(59, 130, 246, 0.22);
      color: #bfdbfe;
    }
    .nav-ico {
      display: block;
      flex-shrink: 0;
    }
    .nav-label { min-width: 0; line-height: 1.3; }
    .sidebar-footer {
      padding: 0.75rem 0.65rem 0.25rem;
      font-size: 0.72rem;
      line-height: 1.35;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
      word-break: break-all;
      white-space: pre-line;
    }
    .admin-body {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }
    .admin-topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 0.85rem 1.35rem;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 12, 17, 0.82);
      backdrop-filter: blur(14px) saturate(1.2);
    }
    .topbar-title-block { min-width: 0; flex: 1; }
    .topbar-kicker {
      margin: 0 0 0.15rem;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }
    .page-title {
      margin: 0;
      font-size: 1.22rem;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .who-chip {
      display: inline-flex;
      align-items: center;
      max-width: min(240px, 38vw);
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-actions button { width: auto; margin: 0; padding: 0.45rem 0.9rem; font-size: 0.84rem; }
    .sidebar-toggle {
      display: none;
      width: auto;
      margin: 0;
      padding: 0.5rem 0.65rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.85rem;
      box-shadow: none;
      line-height: 0;
    }
    .sidebar-toggle svg { display: block; }
    .sidebar-toggle:hover { filter: none; background: rgba(255, 255, 255, 0.08); }
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 15;
    }
    .admin-shell.sidebar-open .sidebar-backdrop { display: block; }
    .admin-content {
      flex: 1;
      padding: 1.35rem 1.35rem 2.75rem;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      animation: content-in 0.35s var(--ease);
    }
    @keyframes content-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) {
      .admin-shell {
        grid-template-columns: 1fr;
      }
      .sidebar-toggle { display: inline-block; }
      .admin-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 20;
        width: min(var(--sidebar-w), 88vw);
        transform: translateX(-105%);
        transition: transform 0.22s ease;
        box-shadow: var(--shadow);
      }
      .admin-shell.sidebar-open .admin-sidebar {
        transform: translateX(0);
      }
      .admin-topbar .page-title { flex: 1; min-width: 0; }
    }

    .dashboard-hero {
      margin-bottom: 1.75rem;
    }
    .dashboard-eyebrow {
      margin: 0 0 0.35rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .dashboard-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .dashboard-lead { margin: 0.4rem 0 0; font-size: 0.92rem; max-width: 42rem; }
    .dashboard-hero-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }
    .dashboard-hero-row .dashboard-hero { margin-bottom: 0; flex: 1; min-width: 220px; }
    .dashboard-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .dashboard-actions button { margin: 0; width: auto; }
    .dashboard-meta {
      margin: 1.35rem 0 0;
      font-size: 0.8rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.65rem;
    }
    .linkish {
      background: none !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      width: auto !important;
      font: inherit;
      font-weight: 600;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .linkish:hover { color: #93c5fd; filter: none !important; }
    .kpi-skeleton {
      min-height: 92px;
      pointer-events: none;
      position: relative;
      overflow: hidden;
    }
    .kpi-skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 40%,
        rgba(255, 255, 255, 0.06) 50%,
        transparent 60%
      );
      background-size: 200% 100%;
      animation: kpi-shine 1.35s ease-in-out infinite;
    }
    @keyframes kpi-shine {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .kpi-group { margin-bottom: 1.6rem; }
    .kpi-group-title {
      margin: 0 0 0.65rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 0.85rem;
    }
    @media (min-width: 1100px) {
      .grid-kpi { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    }
    .kpi {
      --kpi-accent: var(--accent);
      position: relative;
      overflow: hidden;
      background: linear-gradient(165deg, var(--panel) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem 1rem 1rem 1.15rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .kpi::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--kpi-accent);
      border-radius: 3px 0 0 3px;
    }
    .kpi:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }
    .kpi--blue { --kpi-accent: #3b82f6; }
    .kpi--violet { --kpi-accent: #8b5cf6; }
    .kpi--emerald { --kpi-accent: #10b981; }
    .kpi--amber { --kpi-accent: #f59e0b; }
    .kpi--rose { --kpi-accent: #f43f5e; }
    .kpi strong {
      display: block;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .kpi span {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    .toolbar, .row-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .row-actions button, .toolbar button { width: auto; margin: 0; padding: 0.38rem 0.65rem; font-size: 0.8rem; }
    .panel {
      background: linear-gradient(168deg, rgba(26, 35, 48, 0.55) 0%, rgba(16, 24, 32, 0.9) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.05rem 1.1rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    }
    .panel-header {
      margin: 0 0 0.65rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }
    .panel-header h2 {
      margin: 0;
      font-size: 1.02rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .panel-header .muted { margin: 0.35rem 0 0; font-size: 0.86rem; line-height: 1.45; }
    .panel-flush { padding: 0; overflow: hidden; }
    .panel-toolbar {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
    }
    .panel-toolbar input,
    .panel-toolbar select {
      margin-top: 0;
    }
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-scroll::-webkit-scrollbar { height: 8px; }
    .table-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
    }
    table, .data-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .data-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      text-align: left;
      padding: 0.65rem 0.75rem;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      background: rgba(16, 24, 32, 0.97);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .data-table tbody td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .data-table tbody tr { transition: background 0.12s var(--ease); }
    .data-table tbody tr:hover td { background: rgba(59, 130, 246, 0.055); }
    .data-table td:first-child, .data-table th:first-child { padding-left: 1rem; }
    .data-table td:last-child, .data-table th:last-child { padding-right: 1rem; }
    .data-table .cell-mono { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); }
    /* Legacy tables (ohne .data-table) */
    table:not(.data-table) th, table:not(.data-table) td {
      text-align: left;
      padding: 0.5rem 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    table:not(.data-table) th { color: var(--muted); font-weight: 500; }
    table:not(.data-table) tr:hover td { background: rgba(59, 130, 246, 0.06); }
    .pill {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
      color: var(--muted);
      white-space: nowrap;
    }
    .pill-ok { border-color: rgba(34, 197, 94, 0.45); color: #86efac; background: rgba(34, 197, 94, 0.1); }
    .pill-warn { border-color: rgba(239, 68, 68, 0.45); color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
    .pill-neutral { border-color: rgba(255, 255, 255, 0.1); }
    .empty-hint {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .loading-block {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 1rem 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .loading-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: load-pulse 0.9s ease-in-out infinite;
    }
    .loading-dot:nth-child(2) { animation-delay: 0.15s; opacity: 0.85; }
    .loading-dot:nth-child(3) { animation-delay: 0.3s; opacity: 0.7; }
    @keyframes load-pulse {
      0%, 80%, 100% { transform: scale(0.65); opacity: 0.45; }
      40% { transform: scale(1); opacity: 1; }
    }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; color: var(--muted); }
    .hidden { display: none !important; }
    /* Nutzer-Detail (Admin) */
    .user-profile { padding: 1.1rem 1.15rem; }
    .user-profile-header {
      display: flex;
      gap: 1.1rem;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 0.25rem;
    }
    .user-avatar {
      width: 96px;
      height: 96px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }
    .user-avatar.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.7rem;
      text-align: center;
      padding: 0.35rem;
    }
    .user-profile-title h2 {
      margin: 0 0 0.35rem;
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .user-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.45rem;
    }
    .badge {
      font-size: 0.72rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.admin {
      border-color: var(--accent);
      color: var(--accent);
    }
    .badge.ok {
      border-color: rgba(34, 197, 94, 0.5);
      color: var(--ok);
    }
    .badge.warn {
      border-color: rgba(239, 68, 68, 0.45);
      color: #f87171;
    }
    .user-profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem 1.25rem;
      margin-top: 1rem;
    }
    .user-section h3 {
      margin: 0 0 0.4rem;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .user-bio {
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.92rem;
    }
    .user-address p {
      margin: 0 0 0.45rem;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .mono-small {
      font-size: 0.8rem;
      color: var(--muted);
    }
    details.user-raw-json {
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
    }
    details.user-raw-json summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.85rem;
      user-select: none;
    }
    details.user-raw-json pre {
      max-height: 14rem;
      overflow: auto;
      margin-top: 0.5rem;
      font-size: 0.72rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="view-login" class="login-page">
    <div class="login-box">
      <div class="login-brand">
        <span class="login-mark" aria-hidden="true">CC</span>
        <div>
          <h1>CardCore Admin</h1>
          <p class="muted" style="margin:0;">Anmeldung mit Admin-Konto (JWT).</p>
        </div>
      </div>
      <label>E-Mail<input type="email" id="login-email" autocomplete="username" placeholder="admin@beispiel.de" /></label>
      <label>Passwort<input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" /></label>
      <button type="button" id="btn-login">Anmelden</button>
      <p id="login-error" class="error hidden"></p>
    </div>
  </div>

  <div id="view-app" class="hidden">
    <div class="admin-shell" id="admin-shell">
      <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
      <aside class="admin-sidebar" aria-label="Hauptnavigation">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">CC</span>
          <div class="brand-text">
            <strong>CardCore</strong>
            <span class="muted">Admin-Konsole</span>
          </div>
        </div>
        <nav class="sidebar-nav" id="tabs"></nav>
        <div class="sidebar-footer muted" id="who-sidebar"></div>
      </aside>
      <div class="admin-body">
        <header class="admin-topbar">
          <button type="button" class="sidebar-toggle secondary" id="sidebar-toggle" aria-label="Menü öffnen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <div class="topbar-title-block">
            <p class="topbar-kicker" id="page-kicker">Übersicht</p>
            <h2 class="page-title" id="page-title">Dashboard</h2>
          </div>
          <div class="topbar-actions">
            <span class="who-chip muted" id="who" title=""></span>
            <button type="button" class="secondary" id="btn-logout">Abmelden</button>
          </div>
        </header>
        <main class="admin-content">
          <section id="tab-dashboard"></section>
          <section id="tab-users" class="hidden"></section>
          <section id="tab-listings" class="hidden"></section>
          <section id="tab-revenue" class="hidden"></section>
          <section id="tab-support" class="hidden"></section>
          <section id="tab-reports" class="hidden"></section>
          <section id="tab-invites" class="hidden"></section>
          <section id="tab-app" class="hidden"></section>
          <section id="tab-welcome" class="hidden"></section>
        </main>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>

</body>
</html>
